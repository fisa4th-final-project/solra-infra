apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: solra
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'node-exporter'
        static_configs:
          - targets:
              - 10.5.100.11:9100  # master1
              - 10.5.100.12:9100  # master2
              - 10.5.100.13:9100  # master3
              - 10.5.100.21:9100  # worker1
              - 10.5.100.22:9100  # worker2
              - 10.5.100.23:9100  # worker3
